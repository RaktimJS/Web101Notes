<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CSS Grid Item Properties</title>

  <style>
    .container {
      display: grid;

      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 150px;

      gap: 10px;

      width: 800px;
      margin: 50px auto;
      border: 3px solid black;
      padding: 10px;
    }

    .item {
      background-color: dodgerblue;
      color: white;
      font-size: 24px;

      display: flex;
      justify-content: center;
      align-items: start;
    }

    /* Item 2 */
    .item:nth-of-type(2) {
      width: 100px;
      height: 100px;
/* align slef means it aligns self but align item is for all */
      align-self: center;
      justify-self: center;
    }

    /* Item 4 grid-column*/
    .item:nth-of-type(3) {
      grid-column: 2 / 4;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>

    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>

    <div class="item">7</div>
    <div class="item">8</div>
    <div class="item">9</div>

  </div>

</body>

</html>
