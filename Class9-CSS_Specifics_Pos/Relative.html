<!DOCTYPE html>
<html>
<head>
  <title>Position Relative</title>

  <style>
    .box {
      width: 150px;
      height: 100px;
      background-color: tomato;

      position: relative;

      /*
        Move the box 50px down
        from where it originally was.
      */
      top: 50px;

      /*
        Move the box 50px to the right
        from where it originally was.
      */
      left: 50px;
    }

    .box2 {
      width: 150px;
      height: 100px;
      background-color: steelblue;
    }
  </style>
</head>

<body>

  <h1>Relative Position</h1>

  <div class="box">
    Box 1
  </div>

  <div class="box2">
    Box 2
  </div>

</body>
</html>
