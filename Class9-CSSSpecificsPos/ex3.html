<!DOCTYPE html>
<html>
<head>
  <title>CSS Inheritance</title>

  <style>
    /* Parent defines the values */
    .parent {
      color: blue;
      font-size: 20px;
    }

    /* Child explicitly inherits the parent's values */
    .child {
      color: inherit;
      font-size: inherit;
    }
  </style>
</head>

<body>

  <div class="parent">

    I am the parent.

    <p class="child">
      I am the child.
    </p>

  </div>

</body>
</html>
