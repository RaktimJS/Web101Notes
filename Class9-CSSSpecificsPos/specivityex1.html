<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CSS Specificity</title>

  <style>
    .favourite {
      color: green;
    }

    #fruits {
      color: red;
    }
  </style>
</head>

<body>

  <h1>My Favourite Fruits</h1>

  <ul>
    <li class = "favourite">Apple</li>
    <li id="fruits" class="favourite">Mango</li>
    <li>Orange</li>
  </ul>

</body>

</html>
