<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Flexbox Basics</title>

  <style>
    .container {
      background-color: tomato;
      border: 2px solid black;
      height: 1000px;
      width: 1000px;
      display: flex;
      justify-content: flex-start;
    
    }

    .box {
      height: 100px;
      width: 100px;
      background-color: dodgerblue;
      margin: 20px;
     
    }
    .box1{
        order : 2;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="box box1">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
    <div class="box">7</div>
    <div class="box">8</div>
     <div class="box">9</div>
    <div class="box">10</div>

  </div>

</body>

</html>
